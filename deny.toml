# cargo-deny supply-chain & license policy for beaM. (GPL-3.0-only)

[graph]
all-features = false
no-default-features = false

[advisories]
# Transitive unmaintained advisories with no upstream fix available yet in rawler 0.8 / zbus 5.19:
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is transitive via rawler 0.8.0; no safe upgrade available" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is transitive via accesskit_unix -> atspi -> zbus 5.19; no upgrade in zbus 5.x" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is transitive via accesskit_unix -> atspi -> zbus 5.19; no upgrade in zbus 5.x" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is transitive via accesskit_unix -> atspi -> zbus 5.19; no upgrade in zbus 5.x" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "GPL-3.0-only",
    "OFL-1.1",
]
# rawler is licensed under LGPL-2.1; compatible with beaM.'s GPL-3.0-only via
# LGPL-2.1 Section 3 conversion option (hukuki doğrulama gerekli / legal review recommended).
# epaint_default_fonts bundles Ubuntu Mono under Ubuntu-font-1.0 alongside MIT/Apache-2.0/OFL-1.1.
exceptions = [
    { allow = ["LGPL-2.1"], crate = "rawler" },
    { allow = ["Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
